name: GitHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Ruff & ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv & Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dev tools
        run: uv sync --no-group tests

      - name: Ruff lint
        run: uv run --no-sync ruff check

      - name: Ruff format
        run: uv run --no-sync ruff format --check

      - name: Type check
        run: uv run --no-sync ty check

      - name: Build sdist and wheel
        run: uv build --no-sources

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv & Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: uv sync --no-group dev

      # About half the pytest step is Numba compiling kernels from scratch. Persist
      # its on-disk cache (`cache=True` kernels) between runs.
      #
      # The key must match exactly, with no `restore-keys` fallback: Numba checks a
      # cached kernel only against its own source file, not against jitted callees
      # in other files, so a cache restored from different `src` can run stale
      # machine code. uv.lock is not tracked, so the installed numba/llvmlite
      # versions are read from the environment instead.
      - name: Get Numba version
        id: numba-version
        run: >-
          echo "version=$(uv run --no-sync python -c
          'import numba, llvmlite; print(f"{numba.__version__}-{llvmlite.__version__}")')"
          >> "$GITHUB_OUTPUT"

      - name: Restore Numba cache
        id: numba-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/numba-cache
          key: numba-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-nb${{ steps.numba-version.outputs.version }}-${{ hashFiles('src/**/*.py') }}

      # Most of the run is Numba compiling, one core per process, so xdist spreads
      # the compiling across workers as well as the tests. `loadfile` keeps each
      # file on one worker so module-scoped pipeline fixtures are built once.
      - name: Run pytest
        env:
          NUMBA_CACHE_DIR: ${{ runner.temp }}/numba-cache
        run: >-
          uv run --no-sync pytest -p no:sugar -n auto --dist loadfile
          --cov=src --cov-report=xml --durations=25

      # Saved even when tests fail: the compiled kernels are still valid.
      - name: Save Numba cache
        if: always() && steps.numba-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/numba-cache
          key: ${{ steps.numba-cache.outputs.cache-primary-key }}

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
